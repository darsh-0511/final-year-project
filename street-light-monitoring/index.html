<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Light Monitoring</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <style>
        .download-btn {
            position: absolute;
            top: 70px;           /* Below top margin */
            right: 30px;         /* Reduced right margin */
            z-index: 1000;
            padding: 10px 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .download-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Legend (dots added via CSS) -->
    <div class="legend">
        <div class="working">Working</div>
        <div class="not-working">Not Working</div>
    </div>

    <!-- Weather Data Download Button -->
    <button class="download-btn" id="downloadWeather">
        Weather Data Download
    </button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
